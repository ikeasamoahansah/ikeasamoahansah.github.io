# The URL the site will be built for
# base_url = "https://eiasamoah.me"
base_url = "https://ikeasamoahansah.github.io"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
# highlighting = true

[extra]
# Put all your custom variables here
url = "https://github.com"
# A line to display underneath the main title
subtitle = "Example subtitle"

# Text to display in the footer of the page
copyright = "Copyright authors year"

# Your Google Analytics ID
analytics = ""

# Enables KaTeX math rendering (client-side). See templates/base.html.
# Write inline math as $...$ and display math as $$...$$ in blog posts.
katex_enabled = true
toc = true

[extra.favicon]
favicon_16x16 = "icons/favicon/favicon-16x16.png"
favicon_32x32 = "icons/favicon/favicon-32x32.png"
apple_touch_icon = "icons/favicon/apple-touch-icon.png"
