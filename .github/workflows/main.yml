name: Build and deploy GH Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants the official Pages deployment flow everything it needs —
# no personal access token (secrets.TOKEN) required.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip queued runs behind the newest push
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          # Build only; deployment is handled below by actions/deploy-pages
          BUILD_ONLY: true

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
