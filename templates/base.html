<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ike Asamoah-Ansah{% endblock %}</title>
  <meta name="description" content="{% block description %}Ike Asamoah-Ansah, undergraduate at KNUST, machine learning engineer and researcher.{% endblock %}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="{% block og_title %}Ike Asamoah-Ansah{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Ike Asamoah-Ansah, undergrad @ KNUST, machine learning engineer and cancer researcher.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path=config.extra.favicon.favicon_32x32) }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path=config.extra.favicon.favicon_16x16) }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path=config.extra.favicon.apple_touch_icon) }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path="styles/styles.css") | safe }}" />

  {% if config.extra.katex_enabled %}
  {% set katex_version = "0.19.1" %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/katex.min.css"
        integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/katex.min.js"
        integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/contrib/auto-render.min.js"
        integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    });
  </script>
  {% endif %}
</head>

<body class="min-h-screen bg-white text-(--ink) antialiased">
  <div class="flex min-h-screen flex-col">

    <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-md supports-backdrop-filter:bg-white/60">
      <nav class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between px-6">
        <a class="signature" href="{{ get_url(path='@/_index.md') }}" aria-label="Ike Asamoah Ansah">Ike</a>
        <div class="flex items-center gap-6 text-sm">
          <a href="{{ get_url(path='@/blog/_index.md') }}" class="{% if current_path is starting_with('/blog') %}text-(--ink) font-medium{% else %}text-(--muted) hover:text-(--ink){% endif %} transition-colors">Blog</a>
          <a href="{{ get_url(path='@/project/_index.md') }}" class="{% if current_path is starting_with('/project') %}text-(--ink) font-medium{% else %}text-(--muted) hover:text-(--ink){% endif %} transition-colors">Projects</a>
          <a href="{{ get_url(path='@/research/_index.md') }}" class="{% if current_path is starting_with('/research') %}text-(--ink) font-medium{% else %}text-(--muted) hover:text-(--ink){% endif %} transition-colors">Publications</a>
        </div>
      </nav>
    </header>

    <main class="mx-auto w-full max-w-3xl flex-1 px-6 py-12 sm:py-16">
      {% block content %}{% endblock %}
    </main>

    <footer>
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-3 px-6 py-8 text-sm text-(--muted) sm:flex-row sm:items-center sm:justify-between">
        <p>© {{ now() | date(format='%Y') }} Ike Asamoah-Ansah</p>
        <div class="flex items-center gap-5">
          <a href="mailto:ikeasamoahansah@outlook.com" class="hover:text-(--ink) transition-colors">Email</a>
          <a href="https://github.com/ikeasamoahansah" target="_blank" rel="noopener noreferrer" class="hover:text-(--ink) transition-colors">GitHub</a>
          <a href="https://www.linkedin.com/in/ikeasamoahansah/" target="_blank" rel="noopener noreferrer" class="hover:text-(--ink) transition-colors">LinkedIn</a>
        </div>
      </div>
    </footer>
  </div>

</body>

</html>
